<style>
  ::ng-deep .mat-mdc-card-header-text{
    width: 100% !important;
  }
</style>
<div style="width: 100%;height: 100%;position: absolute;z-index: 1000 ;background-color: white;" [style.display]="isLoading?'block':'none'">
  <h1>зачекайте будь ласка Йде обробка данних</h1>
</div>

<button mat-flat-button color="danger" *ngIf="!isSignedInFlag" style="background-color: red;color: white;" (click)="signIn()">Sign in</button>
<div>
  <div *ngFor="let chenel of chanels">





    <mat-card appearance="outlined" style="margin: 20px;padding: 20px;">
      <mat-card-header>
        <!-- <mat-card-title>Poodle</mat-card-title> -->
        <mat-card-subtitle>
    <div >
      <div style="display: inline-block;">
        <img [src]="chenel.channelAvatarUrl" referrerpolicy="no-referrer" alt=""
        style="border-radius: 50%;width: 100px;height: 100px;object-fit: cover;display: block;" />
      </div>
      <div style="display: inline-block;vertical-align: top;margin-left: 25px;">
        <a [href]="'https://www.youtube.com/channel/' + chenel.channelId" style="font-size: 25px;line-height: 60px;">{{chenel.channelName}} - {{chenel.percent}}%</a>
      </div>
    </div>
    <div style="width: 100%;">{{chenel.channelDescription}}</div>
    <mat-progress-bar mode="determinate" [value]="chenel.percent"></mat-progress-bar>
    <mat-expansion-panel (opened)="change()" (closed)="change()">
      <mat-expansion-panel-header>
        <mat-panel-title> Список відео </mat-panel-title>
        <!-- <mat-panel-description> This is a summary of the content </mat-panel-description> -->
      </mat-expansion-panel-header>
      <div style="margin-left: 25px;">
        <p *ngFor="let video of chenel.videos">
          <a [href]="video.url">{{video.name}}</a>
        </p>
      </div>
    </mat-expansion-panel>






  </mat-card-subtitle>
</mat-card-header>

</mat-card>    
  </div>

</div>
